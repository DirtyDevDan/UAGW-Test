<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="United Azeroth Mythic+ key board."><title>United Azeroth | Mythic+ Keys</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=unified-home-20260817-3"></head>
<body>
  <div data-site-shell data-current="keys"></div>
  <main class="page" id="main"><div class="page-inner"><header class="content-header"><p class="eyebrow">Dungeon Finder</p><h1 class="page-title">Guild key board</h1><p class="lede">Post the key you want to run, the roles you need, and when you are available.</p></header>
  <div class="key-board-layout"><form class="key-form panel" id="key-form"><h2>Post a key</h2><label>Character name<input id="key-owner" required maxlength="30"></label><div class="form-row"><label>Dungeon<input id="key-dungeon" required placeholder="Dungeon name"></label><label>Key level<input id="key-level" type="number" min="2" max="40" required></label></div><label>Roles needed<div class="role-checks"><label><input type="checkbox" value="Tank"> Tank</label><label><input type="checkbox" value="Healer"> Healer</label><label><input type="checkbox" value="DPS"> DPS</label></div></label><label>Available time<input id="key-time" required placeholder="Friday after 7 PM Pacific"></label><label>Notes<textarea id="key-notes" rows="3" placeholder="Goal, route, learning run, voice chat…"></textarea></label><p class="form-message" id="key-message" role="status"></p><button class="button" type="submit">Post to board</button></form>
    <section><div class="key-board-toolbar"><h2>Open keys</h2><label>Filter level<select id="key-filter"><option value="all">All levels</option><option value="2-6">2–6</option><option value="7-10">7–10</option><option value="11">11+</option></select></label></div><div class="key-list" id="key-list"></div></section></div>
</div></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="site-shell.js?v=arcane-home-20260817-1"></script><script src="script.js"></script><script src="planner.js"></script></body></html>
